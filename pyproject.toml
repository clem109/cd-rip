[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cd-rip"
dynamic = ["version"]
description = "A native macOS CD ripper with ALAC, AAC, FLAC, WAV, artwork, lyrics, and Music import."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "Clement Venard"}]
dependencies = ["mutagen>=1.47,<2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: CD Audio :: CD Ripping",
]

[project.scripts]
cd-rip = "cdrip.cli:entrypoint"

[project.urls]
Repository = "https://github.com/clem109/cd-rip"
Issues = "https://github.com/clem109/cd-rip/issues"

[project.optional-dependencies]
dev = ["build>=1.2,<2", "ruff>=0.11,<1"]
mac = ["pyinstaller>=6.16,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "cdrip.__version__"}

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
